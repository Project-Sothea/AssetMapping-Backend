# Docker Compose for Local Development
# Provides PostgreSQL and Redis for local testing

services:
  postgres:
    image: postgres:15-alpine
    container_name: assetmapping-postgres
    environment:
      POSTGRES_DB: assetmapping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - '55432:5432'
    command: postgres -c listen_addresses='*'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d assetmapping']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assetmapping-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
